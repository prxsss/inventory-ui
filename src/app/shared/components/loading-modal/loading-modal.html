<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [closable]="false"
  [dismissableMask]="false"
  [closeOnEscape]="false"
  [style]="{ width: '20rem' }"
>
  <div class="flex flex-col items-center gap-4 py-6">
    <p-progressspinner />
    <span class="text-surface-600 dark:text-surface-400">{{ message() }}</span>
  </div>
</p-dialog>
