<p-table
  [columns]="columns()"
  [value]="data()"
  [lazy]="true"
  (onLazyLoad)="onLazyLoad.emit($event)"
  [paginator]="true"
  [first]="first()"
  [rows]="rows()"
  [totalRecords]="totalRecords()"
  [loading]="loading()"
  [rowsPerPageOptions]="rowsPerPageOptions()"
  [tableStyle]="{ 'min-width': '40rem' }"
>
  <ng-template pTemplate="header" let-columns>
    <tr>
      @for (col of columns; track col.field) {
        <th>{{ col.header }}</th>
      }
      <th style="width: 10rem">Actions</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-rowData>
    <tr>
      @for (col of columns(); track col.field) {
        <td>
          @switch (col.type) {
            @case ('date') {
              <p-tag [value]="(rowData[col.field] | date) ?? ''" severity="info" />
            }
            @case ('custom') {
              <ng-container
                *ngTemplateOutlet="
                  customCellTemplate() || null;
                  context: { $implicit: rowData, column: col }
                "
              />
            }
            @default {
              <td class="font-medium">{{ rowData[col.field] }}</td>
            }
          }
        </td>
      }
      <!-- Action Buttons -->
      <td>
        <div class="flex gap-2">
          <p-button
            icon="pi pi-pencil"
            severity="secondary"
            variant="text"
            (onClick)="onEdit.emit(rowData)"
            pTooltip="Edit"
          />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            variant="text"
            (onClick)="onDelete.emit(rowData)"
            pTooltip="Delete"
          />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage" let-columns>
    <tr>
      <td [attr.colspan]="columns.length + 1" class="text-muted-color py-8 text-center">
        No records found.
      </td>
    </tr>
  </ng-template>
</p-table>
